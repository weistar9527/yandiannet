<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MBTI 在线测试</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <header class="hero">
      <h1>MBTI 在线测试</h1>
      <p>回答 16 道题，快速了解你更偏向的 MBTI 性格类型。</p>
    </header>

    <section id="quiz"></section>

    <div class="actions">
      <button id="submitBtn" type="button">查看结果</button>
      <button id="resetBtn" type="button" class="secondary">重置作答</button>
    </div>

    <section id="result" class="result hidden" aria-live="polite"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
